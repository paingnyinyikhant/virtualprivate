name: Auto Update V2Ray Keys Every Hour

on:
  schedule:
    # 💡 ၁ နာရီတစ်ကြိမ် Auto Run ခိုင်းခြင်း (နာရီတိုင်း၏ မိနစ် 00 တွင် Run မည်)
    - cron: '0 * * * *'
  workflow_dispatch: # Manual run နိုင်ရန် အစားထည့်ထားခြင်း

jobs:
  update-keys:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests pytz

      - name: Run Script
        run: |
          python update_keys.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add servers
          git diff --staged --quiet || (git commit -m "Auto update servers file [skip ci]" && git push)
