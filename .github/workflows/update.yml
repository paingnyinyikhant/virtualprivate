name: Auto Update Servers

on:
  schedule:
    - cron: '*/30 * * * *'      # every 30 min
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-servers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download Xray-core
        run: |
          set -e
          mkdir -p $HOME/xray-bin
          URL="https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          curl -sSL "$URL" -o /tmp/xray.zip
          unzip -o /tmp/xray.zip -d $HOME/xray-bin/
          chmod +x $HOME/xray-bin/xray
          echo "$HOME/xray-bin" >> $GITHUB_PATH
          $HOME/xray-bin/xray version | head -n 2

      - name: Run tester
        env:
          XRAY_BIN: /home/runner/xray-bin/xray
          XRAY_LOCATION_ASSET: /home/runner/xray-bin
        run: python scripts/fetch_servers.py

      - name: Show result
        run: |
          echo "=== servers ==="
          wc -c servers 2>/dev/null || echo "missing"
          echo ""
          echo "=== decoded preview ==="
          base64 -d servers 2>/dev/null | head -5 || true

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add servers

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto Update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

      - name: Trigger sync
        if: success()
        continue-on-error: true
        run: |
          curl -sf -A "Mozilla/5.0" --max-time 15 \
            "https://mm.virtualalpha.casacam.net/sync/1aa09056548d8bec0e891327c1208531d4d9b403ba19c9bf?force=1" \
            && echo "✓ Sync triggered" || echo "⚠ Sync failed"
