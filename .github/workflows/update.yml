name: Auto Update Servers

on:
  schedule:
    - cron: '0 * * * *'        # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-servers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download Xray-core
        run: |
          set -e
          mkdir -p $HOME/xray-bin
          curl -sSL "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" -o /tmp/xray.zip
          unzip -oq /tmp/xray.zip -d $HOME/xray-bin/
          chmod +x $HOME/xray-bin/xray
          echo "$HOME/xray-bin" >> $GITHUB_PATH

      - name: Run tester
        env:
          XRAY_BIN: /home/runner/xray-bin/xray
          XRAY_LOCATION_ASSET: /home/runner/xray-bin
        run: python scripts/fetch_servers.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto Update: $(TZ=Asia/Yangon date +'%Y-%m-%d %H:%M:%S %Z')"
            git push
          fi

      - name: Trigger sync
        if: success()
        continue-on-error: true
        run: |
          curl -sf -A "Mozilla/5.0" --max-time 15 \
            "https://mm.virtualalpha.casacam.net/sync/1aa09056548d8bec0e891327c1208531d4d9b403ba19c9bf?force=1" \
            && echo "✓ Sync triggered" || echo "⚠ Sync failed"
